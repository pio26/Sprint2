services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: bfn_db
      POSTGRES_USER: bfn_user
      POSTGRES_PASSWORD: bfn_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bfn_user -d bfn_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: sh /app/entrypoint.sh
    volumes:
      - .:/app
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      payment-mock:
        condition: service_started
    environment:
      - DATABASE_HOST=db
      - DATABASE_NAME=bfn_db
      - DATABASE_USER=bfn_user
      - DATABASE_PASSWORD=bfn_password
      - DEBUG=True
      - PAYMENT_SERVICE_URL=http://payment-mock:9000
    restart: on-failure

  payment-mock:
    image: python:3.11-slim
    working_dir: /app
    command: python mock_payment_service.py
    volumes:
      - .:/app
    expose:
      - "9000"
    restart: on-failure

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: on-failure

volumes:
  postgres_data:
